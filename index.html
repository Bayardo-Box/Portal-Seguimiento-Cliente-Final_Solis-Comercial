<style>
  :root { color-scheme: dark; }
  body { font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #07070a; }

  .glass { background: linear-gradient(180deg, rgba(30,30,38,.72), rgba(17,17,22,.86)); border: 1px solid rgba(255,255,255,.07);
           box-shadow: 0 20px 50px -24px rgba(0,0,0,.85), inset 0 1px 0 rgba(255,255,255,.05); }
  .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; color: #ff5359; }
  .rule { width: 36px; height: 2px; background: #e3121a; display: inline-block; vertical-align: middle; margin-right: 10px; }

  /* Fondo de marca: líneas de velocidad del logo */
  .speed { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .speed i { position: absolute; right: -10%; height: 3px; border-radius: 3px; background: linear-gradient(90deg, transparent, #e3121a 40%, #ff5359); opacity: .55; }

  /* Tarjetas de acceso */
  .access { position: relative; display: flex; flex-direction: column; border-radius: 24px; overflow: hidden; isolation: isolate;
            transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease; }
  .access:hover { transform: translateY(-6px); border-color: rgba(227,18,26,.55); box-shadow: 0 30px 60px -28px rgba(227,18,26,.55), 0 20px 50px -24px rgba(0,0,0,.9); }
  .access:focus-visible { outline: 3px solid #ff5359; outline-offset: 4px; }
  .access .media { position: relative; aspect-ratio: 16 / 9; overflow: hidden; }
  .access .media img { width: 100%; height: 100%; object-fit: cover; transition: transform .6s ease; }
  .access:hover .media img { transform: scale(1.06); }
  .access .media::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(7,7,10,0) 30%, rgba(7,7,10,.92)); }
  .access .badge { position: absolute; left: 20px; bottom: -28px; z-index: 2; width: 64px; height: 64px; border-radius: 18px; display: grid; place-items: center;
                   background: linear-gradient(135deg, #ef2b31, #8f0a10); box-shadow: 0 12px 24px -10px rgba(227,18,26,.8), inset 0 1px 0 rgba(255,255,255,.25); }
  .access .badge svg { width: 32px; height: 32px; color: #fff; }
  

  /* Botones metálicos (plata cepillada) */
  .btn-metal { position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; gap: 10px;
               min-height: 50px; padding: 12px 22px; border-radius: 14px; font-weight: 700; color: #0b0b0f; letter-spacing: .01em;
               background: linear-gradient(180deg, #fbfbfc 0%, #dfe2e7 22%, #b9bec7 50%, #a3a9b3 51%, #d4d8de 78%, #f1f2f4 100%);
               border: 1px solid rgba(255,255,255,.65);
               box-shadow: inset 0 1px 0 #fff, inset 0 -2px 3px rgba(0,0,0,.18), 0 12px 26px -14px rgba(0,0,0,.95), 0 0 0 1px rgba(0,0,0,.35);
               transition: transform .15s ease, box-shadow .2s ease, filter .2s ease; }
  .btn-metal::after { content: ''; position: absolute; top: 0; bottom: 0; left: -60%; width: 40%; transform: skewX(-20deg);
                      background: linear-gradient(90deg, transparent, rgba(255,255,255,.85), transparent); transition: left .6s ease; }
  .btn-metal:hover { filter: brightness(1.05); box-shadow: inset 0 1px 0 #fff, inset 0 -2px 3px rgba(0,0,0,.18), 0 16px 30px -14px rgba(227,18,26,.55), 0 0 0 1px rgba(0,0,0,.35); }
  .btn-metal:hover::after, .access:hover .btn-metal::after { left: 130%; }
  .btn-metal:active { transform: translateY(1px); }
  .btn-metal:focus-visible { outline: 3px solid #ff5359; outline-offset: 3px; }
  .btn-metal .dot { width: 26px; height: 26px; border-radius: 9px; display: grid; place-items: center; color: #fff;
                    background: linear-gradient(135deg, #ef2b31, #8f0a10); box-shadow: inset 0 1px 0 rgba(255,255,255,.3); }
  .btn-metal.dark { color: #f1f2f4; background: linear-gradient(180deg, #4a4d55 0%, #2b2d33 48%, #1d1f24 52%, #3a3d44 100%);
                    border-color: rgba(255,255,255,.18); box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 12px 26px -14px rgba(0,0,0,.95); }
  .btn-metal.dark::after { background: linear-gradient(90deg, transparent, rgba(255,255,255,.25), transparent); }


  .view[hidden] { display: none !important; }

  .fade-up { opacity: 0; transform: translateY(14px); animation: up .7s ease forwards; }
  @keyframes up { to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .fade-up { animation: none; opacity: 1; transform: none; } .access, .access .media img { transition: none; } }
</style>

          <h3 class="font-display text-2xl font-extrabold text-white" id="equipoNombre"></h3>
          <p class="mt-1.5 text-[17px] leading-relaxed text-slate-300 max-w-3xl" id="equipoDesc"></p>
        </div>
      </div>
    </div>
  </section>
 </div>
</main>

<footer class="border-t border-white/5">
  <div class="max-w-7xl mx-auto px-5 sm:px-8 py-8 flex flex-col sm:flex-row items-center justify-between gap-3 text-sm text-slate-500">
    <div class="flex items-center gap-3"><span>© <span id="year"></span> <span data-bind="empresa"></span></span></div>
    <div class="font-display font-semibold text-slate-400" data-bind-id="lema"></div>
  </div>
</footer>

<script>
(function () {
  'use strict';
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const safeUrl = u => /^https:\/\//i.test(String(u || '')) ? u : '';

  /* Iconos personalizados (SVG en línea) */
  const ICONOS = {
    target: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4v16h18"/><path d="M7 15l3-3 3 2 5-6"/><circle cx="18" cy="8" r="2.2" fill="currentColor"/></svg>',
    chart:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="3.5" height="9" rx="1"/><rect x="10.25" y="6" width="3.5" height="14" rx="1"/><rect x="16.5" y="3" width="3.5" height="17" rx="1"/></svg>',
    winback: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="8" r="3.5"/><path d="M3.5 20c.6-3.6 3.3-5.5 6.5-5.5 1.3 0 2.5.3 3.5.9"/><path d="M21 14.5a4 4 0 1 1-1.2-2.8"/><path d="M21 10.5v3.2h-3.2"/></svg>',
    tradein: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="13" rx="1.8"/><rect x="13.5" y="8" width="7.5" height="13" rx="1.8"/><path d="M12 4.5h4.5a2 2 0 0 1 2 2V6"/><path d="M17 5l1.5 1.5L20 5"/><path d="M12 19.5H7.5a2 2 0 0 1-2-2V18"/><path d="M7 19l-1.5-1.5L4 19"/></svg>'
  };

  /* Fondo de marca cuando no hay foto: degradado + líneas de velocidad + icono grande */
  function fondoMarca(icono, i) {
    const tonos = [['#2a0507', '#0b0b0f'], ['#16161c', '#3a0609'], ['#1e0407', '#111116'], ['#111116', '#2a0507']][i % 4];
    return `<div class="absolute inset-0" style="background:linear-gradient(135deg,${tonos[0]},${tonos[1]})"></div>
      <div class="speed" aria-hidden="true"><i style="top:28%;width:55%"></i><i style="top:40%;width:38%;opacity:.4"></i><i style="top:52%;width:62%;opacity:.25"></i></div>
      <div class="absolute right-5 top-5 w-24 h-24 text-white/10" aria-hidden="true">${ICONOS[icono] || ''}</div>`;
  }

  function render() {
    const P = portalData, I = P.identidad;
    $$('[data-bind]').forEach(el => { el.textContent = P.meta[el.dataset.bind] || ''; });
    $$('[data-bind-id]').forEach(el => { el.textContent = I[el.dataset.bindId] || ''; });
    $('#equipoNombre').textContent = (I.equipo || {}).nombre || '';
    $('#equipoDesc').textContent = (I.equipo || {}).descripcion || '';
    $('#year').textContent = new Date().getFullYear();

    const hero = safeUrl(P.imagenes && P.imagenes.portada);
    $('#heroMedia').innerHTML = hero ? `<img src="${esc(hero)}" alt="" class="w-full h-full object-cover opacity-50" loading="eager" />` : '';

    $('#accessGrid').innerHTML = P.accesos.map((a, i) => {
      const img = safeUrl(a.imagen);
      return `
      <a href="${esc(safeUrl(a.url) || '#')}" target="_blank" rel="noopener" class="access glass fade-up" style="animation-delay:${120 + i * 90}ms" aria-label="Abrir ${esc(a.titulo)}">
        <div class="media">${img ? `<img src="${esc(img)}" alt="" loading="lazy" />` : fondoMarca(a.icono, i)}
          <span class="absolute right-4 top-4 z-[1] px-2.5 py-1 rounded-full text-[11px] font-bold uppercase tracking-wider bg-ink-950/70 text-solis-300 ring-1 ring-solis-600/40">${esc(a.etiqueta)}</span>
        </div>
        <div class="relative">
          <span class="badge" aria-hidden="true">${ICONOS[a.icono] || ''}</span>
        </div>
        <div class="flex-1 flex flex-col px-5 pt-12 pb-5">
          <h3 class="font-display text-xl font-extrabold text-white leading-snug">${esc(a.titulo)}</h3>
          <p class="mt-2 text-[15px] leading-relaxed text-slate-400 flex-1">${esc(a.descripcion)}</p>
          <span class="btn-metal mt-5 w-full !justify-between text-sm">
            Abrir tablero <span class="dot" aria-hidden="true">↗</span>
          </span>
        </div>
      </a>`;
    }).join('');
  }

  function showView(id) {
    if (!['inicio', 'filosofia'].includes(id)) id = 'inicio';
    $$('.view').forEach(v => { v.hidden = v.dataset.viewId !== id; });
    window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
  }
  document.addEventListener('click', e => {
    const a = e.target.closest('[data-view]');
    if (!a) return;
    e.preventDefault();
    const id = a.dataset.view;
    try { history.pushState(null, '', '#' + id); } catch (err) {}
    showView(id);
  });
  window.addEventListener('popstate', () => showView((location.hash || '').slice(1)));
  window.addEventListener('hashchange', () => { const h = (location.hash || '').slice(1); if (h === 'filosofia' || h === 'inicio') showView(h); });

  render();
  showView((location.hash || '').slice(1) === 'filosofia' ? 'filosofia' : 'inicio');
  if (location.hash === '#accesos') setTimeout(() => $('#accesos').scrollIntoView(), 50);
})();
</script>
</body>
</html>
